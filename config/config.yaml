server:
  host: "0.0.0.0"
  port: 8080
  update_info: False

gpt:
  api_key: $FROM_ENV
  api_url: "https://burn.hair/v1"
  model: "gpt-4o"
  system_prompt: |
    你是一个MCBE的AI助手，根据游戏内玩家的要求和游戏知识回答，你需要遵守以下几点：
    1. 交流中称玩家为"冒险家"
    2. 任何回答时都必须把玩家"工具人"忽略（除非特殊需要）
    3. 当玩家的问题可能需要执行命令获取时，直接调用函数获取而不是叫玩家执行
    4. 请始终保持积极和专业的态度
    5. 回答尽量保持一段话不要太长

# 添加欢迎消息模板
welcome_message_template: |
  -----------
  成功连接WebSocket服务器
  服务器ip:{ip}
  端口:{port}
  GPT上下文:function-call不支持关闭上下文，请使用GPT保存
  GPT模型:{model}
  连接UUID:{uuid}
  -----------

# 添加事件列表
event_lists:
  - "PlayerMessage"
  - "PlayerTransform"
  - "ItemUsed"

functions: [
    {
      "name": "gpt_game_weather", # 函数名称
      "description": "这是一个与MC交互的函数，能够获取MC当前维度的天气", # 函数描述
      "parameters": { "type": "object", "properties": { "dimension": { # 函数参数
                  "type": "string", # 参数类型
                  "description": "玩家目前的维度，例如:'overworld'", # 参数描述
                  "enum": ["overworld", "nether", "the_end"], # 参数可选值
                } }, "required": ["dimension"] }, # 必需参数
    },
    {
      "name": "gpt_game_players", # 函数名称
      "description": "这是一个与MC交互的函数，能够获取MC当前的玩家数量，坐标，维度，等信息，该函数返回玩家信息json，回答时不要特殊格式，坐标每次都重新获取不能用上次坐标，小数保留一位小数，除非特殊要求", # 函数描述
    },
    {
      "name": "gpt_get_time", # 函数名称
      "description": "获取当前维度的时间，游戏时间gametime按tick算，day为游戏天数，玩家询问时间时，请直接告诉玩家换算后的结果，如：早上，正午，晚上", # 函数描述"
      "parameters": { "type": "object", "properties": { "dimension": { # 函数参数
                  "type": "string", # 参数类型
                  "description": "玩家目前的维度，例如:'overworld'", # 参数描述
                  "enum": ["overworld", "nether", "the_end"], # 参数可选值
                } }, "required": ["dimension"] }, # 必需参数
    },
    { "name": "gpt_run_command", "description": "能够在游戏中执行一个或多个命令，命令须符合MCBE的命令格式，否则可能无效", "parameters": { "type": "object", "properties": { "commands": { "type": "array", "items": { "type": "string", "description": "需要执行的命令，如 'say hello, world!'" }, "description": "需要执行的一个或多个命令" } }, "required": ["commands"] } },
    {
      "name": "gpt_world_entity", # 函数名称
      "description": "此函数能够将实体加入获取队列，能获取队列中实体的id，坐标等信息，实体id参数不需要前缀，只能同时获取一个，如果return为查询中，需要告诉玩家再次发起聊天获取", # 函数描述
      "parameters": { "type": "object", "properties": { "entityid": { # 函数参数
                  "type": "string", # 参数类型
                  "description": "查询的实体，例如：pig , zombie", # 参数描述
                } }, "required": ["entityid"] }, # 必需参数
    },
    {
      "name": "gpt_player_inventory", # 函数名称
      "description": "此函数能够获取玩家的背包信息(背包物品索引从0开始，只有有物品的格子才有数据，当前格子数为索引值+1)，回答时返回正确格子数而不是索引值，默认不需要指定玩家，返回json格式，回答时不要特殊格式", # 函数描述
      "parameters": { "type": "object", "properties": { "player_name": { # 函数参数
                  "type": "string", # 参数类型
                  "description": "指定查询的玩家,例如：'player1'", # 参数描述
                } } },
    },
    {
      "name": "gpt_get_commandlog", # 函数名称
      "description": "此函数能够获取命令执行的响应,返回上次执行命令的和执行结果,一些需要查看命令执行结果的，需要提示玩家查看", # 函数描述
    },
  ]

commands:
  login: "#登录"
  gpt_chat: "GPT 聊天"
  gpt_script: "GPT 脚本"
  gpt_save: "GPT 保存"
  run_command: "运行命令"
  script_command: "脚本命令"
  command_log: "命令日志"
  op_manage: "权限管理"

# 将 available_commands 移到顶层
available_commands:
  - "#登录"
  - "GPT 聊天"
  - "GPT 脚本"
  - "GPT 保存"
  - "运行命令"
  - "脚本命令"
  - "命令日志"
  - "权限管理"

special_players:
  tool: "工具人"
  script_engine: "脚本引擎"

data_types:
  - "entity_position"
  - "inventory"
  - "playerinfo"

messages:
  login_required: "请先登录"
  already_logged_in: "你已经登录过啦！"
  login_success: "登录成功！"
  login_failed: "登录失败，密钥无效!"
  script_prefix: "[脚本引擎]"
  gpt_error: "GPT处理出错，请稍后重试"
  no_conversation: "没有对话实例，无法保存！"
  save_success: "对话重启，数据已保存！"
  save_error: "保存对话时出错"
  command_error: "执行命令时出错"
  script_error: "执行脚本命令时出错"
  no_command_log: "暂无命令日志"
  op_usage: "请使用正确的格式：权限管理 [查看/添加/删除] [玩家名]"
  op_add_success: "'{player}' 已被添加为wsOP"
  op_already_exists: "'{player}' 已经是wsOP了"
  op_remove_success: "'{player}' 已从wsOP列表中移除"
  op_not_exists: "'{player}' 不在wsOP列表中"

log_messages:
  token_exists: "已有有效的令牌，拒绝重新生成"
  token_generated: "密钥验证成功，生成令牌: {token}"
  invalid_key: "密钥无效"

dimension_map:
  0: "overworld"
  1: "nether"
  2: "the_end"

functions_map:
  gpt_game_weather: "src.server.game_functions.GameFunctions.gpt_game_weather"
  gpt_game_players: "src.server.game_functions.GameFunctions.gpt_game_players"
  gpt_get_time: "src.server.game_functions.GameFunctions.gpt_get_time"
  gpt_run_command: "src.server.game_functions.GameFunctions.gpt_run_command"
  gpt_world_entity: "src.server.game_functions.GameFunctions.gpt_world_entity"
  gpt_player_inventory: "src.server.game_functions.GameFunctions.gpt_player_inventory"
  gpt_get_commandlog: "src.server.game_functions.GameFunctions.gpt_get_commandlog"
